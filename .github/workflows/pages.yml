name: Deploy WorkTrack to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html styles.css app.js config.js site/
          if [ -z "${{ secrets.APPS_SCRIPT_URL }}" ]; then echo 'APPS_SCRIPT_URL secret is missing' >&2; exit 1; fi
          if [ -z "${{ secrets.SHEET_URL }}" ]; then echo 'SHEET_URL secret is missing' >&2; exit 1; fi
          printf '%s' "${{ secrets.APPS_SCRIPT_URL }}" > site/apps-script-url.txt
          printf '%s' "${{ secrets.SHEET_URL }}" > site/sheet-url.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
